name: portfolio-verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Static type analysis
        run: mypy src/governed_agent
      - name: Behavioral tests
        run: pytest -q
      - name: Portfolio acceptance
        run: python scripts/acceptance_check.py
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Reproducible package build
        run: python -m build
      - name: Upload build evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: governed-agent-verification
          path: dist/
          if-no-files-found: warn
          retention-days: 14
